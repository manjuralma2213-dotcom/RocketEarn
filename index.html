<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp - Premium P2P Share</title>
    <!-- Icons (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS VARIABLES FOR WHATSAPP THEME */
        :root {
            --primary: #008069;
            --primary-light: #00A884;
            --bg-chat: #EFEAE2;
            --bg-panel: #F0F2F5;
            --text-main: #111B21;
            --text-muted: #667781;
            --bubble-me: #D9FDD3;
            --bubble-them: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: #d1d7db; height: 100vh; display: flex; justify-content: center; align-items: center; }

        /* --- LOGIN SCREEN --- */
        #loginScreen {
            background: white; width: 100%; max-width: 400px; padding: 40px; border-radius: 10px; box-shadow: 0 17px 50px 0 rgba(11,20,26,.19); text-align: center;
        }
        #loginScreen i { font-size: 50px; color: var(--primary-light); margin-bottom: 20px; }
        #loginScreen h2 { margin-bottom: 10px; color: var(--text-main); }
        #loginScreen p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input { width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
        .input-group input:focus { border-color: var(--primary); }
        .btn-login { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-login:hover { background: var(--primary-light); }

        /* --- MAIN APP UI --- */
        #mainApp {
            display: none; width: 100%; max-width: 1200px; height: 95vh; background: white; box-shadow: 0 1px 1px 0 rgba(0,0,0,.06); display: flex;
        }

        /* LEFT PANEL (Sidebar) */
        .sidebar { width: 35%; background: white; border-right: 1px solid #d1d7db; display: flex; flex-direction: column; }
        .header { background: var(--bg-panel); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; height: 60px; }
        .header .user-info { display: flex; align-items: center; font-weight: 500; font-size: 16px; }
        .header i { font-size: 24px; color: var(--text-muted); margin-right: 15px; }
        
        .search-bar { background: white; padding: 10px; border-bottom: 1px solid #d1d7db; display: flex; }
        .search-bar input { flex: 1; padding: 10px; border: none; background: var(--bg-panel); border-radius: 8px; outline: none; font-size: 14px; }
        .search-bar button { padding: 10px 15px; background: var(--primary); color: white; border: none; border-radius: 8px; margin-left: 5px; cursor: pointer; }

        .requests-area { flex: 1; overflow-y: auto; background: white; }
        .request-item { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f2f2f2; }
        .request-item .name { font-weight: 500; }
        .btn-accept { background: var(--primary-light); color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 12px; }

        /* RIGHT PANEL (Chat Window) */
        .chat-window { width: 65%; display: flex; flex-direction: column; background: var(--bg-panel); position: relative; }
        .chat-header { background: var(--bg-panel); height: 60px; padding: 10px 20px; display: flex; align-items: center; border-bottom: 1px solid #d1d7db; }
        .chat-header .friend-name { font-size: 16px; font-weight: 500; margin-left: 15px; }

        .chat-body { flex: 1; background-color: var(--bg-chat); background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        
        /* Message Bubbles */
        .msg-row { display: flex; width: 100%; margin-bottom: 10px; }
        .msg-row.me { justify-content: flex-end; }
        .msg-row.them { justify-content: flex-start; }
        
        .bubble { max-width: 65%; padding: 10px 15px; border-radius: 8px; position: relative; font-size: 14.5px; line-height: 20px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; }
        .msg-row.me .bubble { background: var(--bubble-me); border-top-right-radius: 0; }
        .msg-row.them .bubble { background: var(--bubble-them); border-top-left-radius: 0; }
        
        .bubble pre { white-space: pre-wrap; font-family: inherit; margin: 0; }
        
        .msg-actions { margin-top: 8px; display: flex; gap: 10px; font-size: 12px; }
        .msg-actions button { background: none; border: none; color: var(--primary); cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 5px;}
        .msg-actions button:hover { text-decoration: underline; }

        /* Chat Footer (Input) */
        .chat-footer { background: var(--bg-panel); padding: 10px 20px; display: flex; align-items: center; gap: 10px; }
        .btn-attach { background: none; border: none; font-size: 24px; color: var(--text-muted); cursor: pointer; position: relative; }
        .btn-attach input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        
        .chat-footer textarea { flex: 1; padding: 12px 20px; border-radius: 24px; border: none; outline: none; font-size: 15px; resize: none; max-height: 100px; }
        
        .btn-send { background: var(--primary); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; }

        /* Welcome Screen (Before Chat) */
        .welcome-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--bg-panel); text-align: center; }
        .welcome-screen i { font-size: 100px; color: #ccc; margin-bottom: 20px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- 1. LOGIN SCREEN -->
<div id="loginScreen">
    <i class="fab fa-whatsapp"></i>
    <h2>Welcome to ChatApp</h2>
    <p>Enter a username to get started</p>
    <div class="input-group">
        <input type="text" id="username" placeholder="Phone number or Username" onkeypress="handleLoginEnter(event)">
    </div>
    <button class="btn-login" onclick="window.login()">Agree and Continue</button>
</div>

<!-- 2. MAIN APP UI -->
<div id="mainApp" class="hidden">
    
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
        <!-- Header -->
        <div class="header">
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span id="myUsername">User</span>
            </div>
            <i class="fas fa-ellipsis-v"></i>
        </div>
        
        <!-- Add Friend -->
        <div class="search-bar">
            <input type="text" id="targetUser" placeholder="Enter friend's username...">
            <button onclick="window.sendRequest()"><i class="fas fa-user-plus"></i></button>
        </div>

        <!-- Requests List -->
        <div class="requests-area" id="requestsArea">
            <div style="padding: 15px; color: var(--text-muted); font-size: 14px; text-align: center;">No new requests</div>
        </div>
    </div>

    <!-- RIGHT CHAT WINDOW -->
    <div class="chat-window">
        <!-- Welcome Screen (Shown initially) -->
        <div id="welcomeScreen" class="welcome-screen">
            <i class="fas fa-comments"></i>
            <h2>ChatApp Web</h2>
            <p style="color: var(--text-muted);">Send and receive messages and large files without keeping your phone online.<br>Connect with a friend to start.</p>
        </div>

        <!-- Active Chat Interface -->
        <div id="chatInterface" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
            <!-- Header -->
            <div class="chat-header">
                <i class="fas fa-user-circle" style="font-size: 40px; color: #ccc;"></i>
                <div class="friend-name" id="chattingWith">Friend Name</div>
            </div>

            <!-- Messages Area -->
            <div class="chat-body" id="messages">
                <!-- Messages will appear here -->
            </div>

            <!-- Input Area -->
            <div class="chat-footer">
                <button class="btn-attach">
                    <i class="fas fa-paperclip"></i>
                    <input type="file" id="fileInput">
                </button>
                <textarea id="msgInput" placeholder="Type a message or paste unlimited text..."></textarea>
                <button class="btn-send" onclick="window.sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Firebase v9 Modular SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3pHuV6hqAVxosizYSy4dwae73s9KT8ig",
      authDomain: "chatapp-dfe34.firebaseapp.com",
      databaseURL: "https://chatapp-dfe34-default-rtdb.firebaseio.com",
      projectId: "chatapp-dfe34",
      storageBucket: "chatapp-dfe34.firebasestorage.app",
      messagingSenderId: "565916852797",
      appId: "1:565916852797:web:8182eaaa1b7bc8c9840054"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = "";
    let currentFriend = "";
    let chatRoomID = "";

    // Security: Function to fix "System Core" error & prevent HTML bugs
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag]));
    }

    // 1. LOGIN
    window.login = function() {
        const user = document.getElementById('username').value.trim();
        if(user) {
            currentUser = user;
            document.getElementById('loginScreen').classList.add('hidden');
            
            // Flex to show main app layout
            const mainApp = document.getElementById('mainApp');
            mainApp.classList.remove('hidden');
            mainApp.style.display = 'flex';
            
            document.getElementById('myUsername').innerText = user;

            set(ref(db, 'users/' + currentUser), true);
            listenForRequests();
        } else {
            alert("Please enter a username!");
        }
    };

    window.handleLoginEnter = function(e) {
        if(e.key === 'Enter') window.login();
    }

    // 2. SEND REQUEST
    window.sendRequest = function() {
        const to = document.getElementById('targetUser').value.trim();
        if(to && to !== currentUser) {
            set(ref(db, 'requests/' + to), currentUser);
            alert("Request sent to " + to);
            document.getElementById('targetUser').value = "";
        }
    };

    // 3. LISTEN FOR REQUESTS
    function listenForRequests() {
        onValue(ref(db, 'requests/' + currentUser), (snapshot) => {
            const fromUser = snapshot.val();
            if (fromUser) {
                document.getElementById('requestsArea').innerHTML = `
                    <div class="request-item">
                        <div class="name"><i class="fas fa-bell" style="color:var(--primary); margin-right:5px;"></i> ${fromUser}</div>
                        <button class="btn-accept" onclick="window.acceptRequest('${fromUser}')">Accept</button>
                    </div>
                `;
            } else {
                document.getElementById('requestsArea').innerHTML = `<div style="padding: 15px; color: var(--text-muted); font-size: 14px; text-align: center;">No new requests</div>`;
            }
        });
    }

    // 4. ACCEPT REQUEST
    window.acceptRequest = function(fromUser) {
        currentFriend = fromUser;
        chatRoomID = [currentUser, fromUser].sort().join("_");
        
        set(ref(db, 'accepted/' + fromUser), currentUser);
        remove(ref(db, 'requests/' + currentUser)); 
        
        startChatUI(fromUser);
    };

    // 5. CHECK ACCEPTANCE
    setInterval(() => {
        if(currentUser && !currentFriend){
            onValue(ref(db, 'accepted/' + currentUser), (snapshot) => {
                const friend = snapshot.val();
                if(friend) {
                    currentFriend = friend;
                    chatRoomID = [currentUser, friend].sort().join("_");
                    remove(ref(db, 'accepted/' + currentUser));
                    startChatUI(friend);
                }
            }, { onlyOnce: true });
        }
    }, 2000);

    function startChatUI(friend) {
        document.getElementById('welcomeScreen').classList.add('hidden');
        document.getElementById('chatInterface').classList.remove('hidden');
        document.getElementById('chattingWith').innerText = friend;
        listenForMessages();
    }

    // 6. SEND UNLIMITED TEXT / FILE
    window.sendMessage = function() {
        if (!currentFriend) return;

        const inputEl = document.getElementById('msgInput');
        const text = inputEl.value; // RAW Text fetch to avoid errors
        const fileInput = document.getElementById('fileInput').files[0];

        if (fileInput) {
            const reader = new FileReader();
            reader.readAsDataURL(fileInput);
            reader.onload = () => {
                push(ref(db, 'chats/' + chatRoomID), {
                    sender: currentUser,
                    message: reader.result,
                    type: 'file',
                    filename: fileInput.name,
                    timestamp: Date.now()
                });
            };
        } else if (text.trim() !== "") {
            push(ref(db, 'chats/' + chatRoomID), {
                sender: currentUser,
                message: text,
                type: 'text',
                timestamp: Date.now()
            });
        }
        
        inputEl.value = "";
        document.getElementById('fileInput').value = "";
    };

    // 7. LISTEN MESSAGES
    function listenForMessages() {
        onChildAdded(ref(db, 'chats/' + chatRoomID), (snapshot) => {
            const data = snapshot.val();
            appendMessage(data.sender, data.message, data.type, data.filename);
        });
    }

    // 8. APPEND UI (With Text Protection)
    function appendMessage(sender, rawData, type, filename) {
        const isMe = sender === currentUser;
        const msgRow = document.createElement('div');
        msgRow.className = isMe ? 'msg-row me' : 'msg-row them';
        
        const uniqueId = "id_" + Math.random().toString(36).substr(2, 9); 
        
        let content = '';
        let actions = '';

        if (type === 'text') {
            // Fix "System Core" Issue: Using strict escaping
            const safeData = escapeHTML(rawData);
            
            content = `<pre id="${uniqueId}">${safeData}</pre>`;
            actions = `
                <div class="msg-actions">
                    <button onclick="window.copyText('${uniqueId}')"><i class="fas fa-copy"></i> Copy</button>
                    <button onclick="window.downloadText('${uniqueId}')"><i class="fas fa-download"></i> TXT</button>
                </div>
            `;
        } else if (type === 'file') {
            content = `<div><i class="fas fa-file" style="font-size:30px; margin-bottom:10px; color:#666;"></i><br><b>${filename}</b></div>`;
            actions = `
                <div class="msg-actions">
                    <button onclick="window.downloadFile('${rawData}', '${filename}')"><i class="fas fa-download"></i> Download</button>
                </div>
            `;
        }

        msgRow.innerHTML = `
            <div class="bubble">
                ${content}
                ${actions}
            </div>
        `;

        const messagesBox = document.getElementById('messages');
        messagesBox.appendChild(msgRow);
        messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    // --- REAL-TIME UTILITIES ---
    window.copyText = function(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => {
            // Small temporary visual feedback
            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-check" style="color:green;"></i> Copied!`;
            setTimeout(() => btn.innerHTML = originalHTML, 2000);
        });
    };

    window.downloadText = function(elementId) {
        const text = document.getElementById(elementId).innerText;
        const blob = new Blob([text], { type: 'text/plain' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "ChatApp_Message.txt";
        link.click();
    };

    window.downloadFile = function(base64Data, filename) {
        const link = document.createElement('a');
        link.href = base64Data;
        link.download = filename;
        link.click();
    };
</script>

</body>
</html>
